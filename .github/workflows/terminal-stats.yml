name: terminal-stats

# Rewrites ONLY the stat numbers inside the committed SVGs — it never
# regenerates them, so hand-tuned ASCII art in those files is safe.
# Uses the automatic GITHUB_TOKEN only — no secrets to configure.

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  push:
    branches: [ main, master ]
    paths:
      - "assets/update_stats.py"
      - "assets/generate_readme.py"
      - ".github/workflows/terminal-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stat numbers in the committed SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT_LOC: "1"
        run: python3 assets/update_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- assets/terminal.svg assets/terminal_light.svg assets/stats_cache.json
          if git diff --cached --quiet; then
            echo "no stat changes"
          else
            git commit -m "chore: refresh terminal stats [skip ci]"
            git push
          fi
